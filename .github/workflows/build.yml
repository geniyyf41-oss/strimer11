
name: Build Stream Control

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract ZIP
        run: unzip -q streamcontrol-build-ready.zip

      - name: Build JAR
        working-directory: streamcontrol-mod
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: StreamControl-JAR
          path: streamcontrol-mod/build/libs/streamcontrol-1.0.0.jar
          if-no-files-found: error
